<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="200" y1="100" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="350" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="700" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="0" y1="80" x2="700" y2="80"/>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="0" y1="400" x2="700" y2="400"/>
  </g>

  <!-- Central Cloud & System Architecture Hub -->
  <ellipse cx="350" cy="230" rx="180" ry="100" fill="url(#blueGlow)" opacity="0.15"/>
  
  <!-- Network Nodes & Connecting Lines -->
  <path d="M180 200 L320 160 L480 190 L520 320 L350 360 L200 320 Z" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <line x1="320" y1="160" x2="350" y2="360" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
  <line x1="180" y1="200" x2="480" y2="190" stroke="#22D3EE" stroke-width="1.5" opacity="0.3"/>

  <!-- Main System Dashboard Window -->
  <g filter="url(#shadowFilter)">
    <rect x="110" y="70" width="480" height="310" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect x="110" y="70" width="480" height="38" rx="14" fill="#1E293B"/>
    <circle cx="135" cy="89" r="5" fill="#EF4444"/>
    <circle cx="152" cy="89" r="5" fill="#F59E0B"/>
    <circle cx="169" cy="89" r="5" fill="#10B981"/>
    <text x="280" y="94" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">titan-core-cluster // status: healthy</text>

    <!-- Code & Metric Panels -->
    <rect x="135" y="125" width="230" height="110" rx="8" fill="#172133" stroke="#2563EB" stroke-opacity="0.3"/>
    <text x="150" y="150" fill="#22D3EE" font-family="monospace" font-size="12">const cluster = new CloudMesh({</text>
    <text x="165" y="172" fill="#E2E8F0" font-family="monospace" font-size="11">redundancy: "active-active",</text>
    <text x="165" y="192" fill="#E2E8F0" font-family="monospace" font-size="11">aiInference: "accelerated",</text>
    <text x="165" y="212" fill="#38BDF8" font-family="monospace" font-size="11">slaTarget: "99.999%"</text>
    <text x="150" y="228" fill="#22D3EE" font-family="monospace" font-size="12">});</text>

    <!-- Latency / Throughput Graph Box -->
    <rect x="380" y="125" width="185" height="110" rx="8" fill="#172133" stroke="#334155"/>
    <text x="395" y="148" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">THROUGHPUT (OPS/SEC)</text>
    <text x="395" y="175" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="700">4.82M</text>
    <path d="M395 210 Q 420 190 445 205 T 495 185 T 545 170" fill="none" stroke="#22D3EE" stroke-width="2.5"/>

    <!-- Bottom Metrics -->
    <rect x="135" y="250" width="135" height="105" rx="8" fill="#172133" stroke="#334155"/>
    <text x="150" y="275" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">CLOUD DEPLOYMENTS</text>
    <text x="150" y="305" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="22" font-weight="800">1,240+</text>
    <text x="150" y="330" fill="#10B981" font-family="'Inter', sans-serif" font-size="10">▲ 99.99% Uptime</text>

    <rect x="285" y="250" width="135" height="105" rx="8" fill="#172133" stroke="#334155"/>
    <text x="300" y="275" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">AI AUTOMATION</text>
    <text x="300" y="305" fill="#A855F7" font-family="'Inter', sans-serif" font-size="22" font-weight="800">420ms</text>
    <text x="300" y="330" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Avg. P99 Latency</text>

    <rect x="435" y="250" width="130" height="105" rx="8" fill="#172133" stroke="#334155"/>
    <text x="450" y="275" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">ENTERPRISE SEC</text>
    <text x="450" y="305" fill="#10B981" font-family="'Inter', sans-serif" font-size="22" font-weight="800">Zero</text>
    <text x="450" y="330" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Breach Record</text>
  </g>

  <!-- Floating Badge Left -->
  <g filter="url(#shadowFilter)">
    <rect x="50" y="290" width="160" height="60" rx="10" fill="#1E293B" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="75" cy="320" r="14" fill="#2563EB"/>
    <text x="70" y="325" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">✓</text>
    <text x="98" y="315" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ISO 27001 & SOC2</text>
    <text x="98" y="332" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Audited Security</text>
  </g>

  <!-- Floating Badge Right -->
  <g filter="url(#shadowFilter)">
    <rect x="490" y="330" width="170" height="65" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="518" cy="362" r="15" fill="#22D3EE"/>
    <path d="M512 362 L516 366 L524 358" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="542" y="355" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">DevOps Automated</text>
    <text x="542" y="372" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="10">Continuous CI/CD</text>
  </g>
</svg>
